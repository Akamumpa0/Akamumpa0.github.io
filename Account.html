            <div class="header-content">
                <div class="logo">
                    <h2>Must Hospital</h2>
                </div>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="home.html" class="nav-link">Home</a></li>
                        <li>
                            <a href="#services" class="nav-link services">Services</a>
                            <div class="submenu">
                                <ul>
                                    <li><a href="appointment.html" class="submenu-link">Appointment</a></li>
                                    <li><a href="healthtrack.html" class="submenu-link">Healthtrack</a></li>

            </div>
        </div>
    </header>

    <!-- Account Section -->
    <section class="account">
        <div class="container">
            <div class="account-content">
                <div class="account-text">
                    <h1>Your Account</h1>
                    <p>View and edit your personal information below. Upload a profile picture to personalize your account.</p>
                </div>
                <div class="account-form">
                    <div class="profile-picture">
                        <img id="profile-img" src="https://via.placeholder.com/150" alt="Profile Picture">
                        <input type="file" id="profile-upload" accept="image/*">
                        <button class="btn-primary upload-btn">Upload Picture</button>
                    </div>
                    <form id="account-form">
                        <label for="name">Full Name:</label>
                        <input type="text" id="name" name="name" required>
                        <label for="age">Age:</label>
                        <input type="number" id="age" name="age" min="1" required>
                        <label for="birthday">Birthday:</label>
                        <input type="date" id="birthday" name="birthday" required>
                        <label for="status">Status:</label>
                        <select id="status" name="status" required>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                            <option value="Other">Other</option>
                        </select>
                        <label for="gender">Gender:</label>
                        <select id="gender" name="gender" required>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                        <label for="residence">Area of Residence:</label>
                        <input type="text" id="residence" name="residence" required>
                        <label for="campus">Campus:</label>
                        <input type="text" id="campus" name="campus" required>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                        <label for="student-id">Student ID:</label>
                        <input type="text" id="student-id" name="student-id" required>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>
                        <label for="district">District of Birth:</label>
                        <input type="text" id="district" name="district" required>
                        <button type="submit" class="btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="account.js"></script>
</body>
</html>
