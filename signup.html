<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Must Hospital</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
</head>
<body>
    <!-- Header Section -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <h2>Must Hospital</h2>
                </div>
                <nav class="nav" id="nav">
                    <ul class="nav-list" id="nav-list">
                        <!-- Navigation links populated dynamically after login -->
                    </ul>
                </nav>
                <div class="auth-buttons" id="auth-buttons">
                    <a href="index.html#login" class="btn-login">Log In</a>
                    <a href="signup.html" class="btn-signup active">Sign Up</a>
                </div>
                <div class="mobile-menu-toggle" id="mobile-menu-toggle">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>
    </header>

    <!-- Sign Up Section -->
    <section class="signup">
        <div class="container">
            <div class="signup-content">
                <div class="signup-text">
                    <h1>Sign Up</h1>
                    <p>Create your Must Hospital account to access personalized medical services.</p>
                </div>
                <div class="signup-form">
                    <form id="signup-form">
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" name="first-name" required>
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last-name" required>
                        <label for="student-id">Student ID:</label>
                        <input type="text" id="student-id" name="student-id" required>
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required>
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>
                        <label for="dob">Date of Birth:</label>
                        <input type="date" id="dob" name="dob" required>
                        <label for="gender">Gender:</label>
                        <select id="gender" name="gender" required>
                            <option value="" disabled selected>Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                        <label for="address">Address:</label>
                        <textarea id="address" name="address" required></textarea>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required>
                        <label for="confirm-password">Confirm Password:</label>
                        <input type="password" id="confirm-password" name="confirm-password" required>
                        <button type="submit" class="btn-primary">Sign Up</button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="signup.js"></script>
</body>
</html>
